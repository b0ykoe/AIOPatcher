# AIOPatcher behind Traefik (v3): dashboard via HTTPS on 443 with a Let's Encrypt certificate.
# Guide, nginx and Nginx Proxy Manager: docs/REVERSE-PROXY.md
#
# Layout:
#   Browser ──HTTPS 443──> Traefik ──HTTPS (CA verified)──> AIOPatcher dashboard 127.0.0.1:9443
#   Agents  ──mTLS 8443───────────────────────────────────> AIOPatcher agent API (direct, NOT through Traefik)
#
# Both containers run with network_mode: host so that ufw keeps applying to all ports (as in docs/SERVER-SETUP.md).
# Traefik reaches the dashboard via 127.0.0.1, so 127.0.0.1 is the only trusted proxy.
#
# Start:
#   mkdir -p /opt/aiopatcher/data /opt/aiopatcher/traefik/letsencrypt   (the container sets the owner of data itself)
#   cp deploy/.env.example .env   # fill in AIOPATCHER_HOSTNAME and ACME_EMAIL
#   cp deploy/traefik/dynamic.yml /opt/aiopatcher/traefik/   # adjust the hostname and networks in it
#   docker compose -f docker-compose.traefik.yml up -d aiopatcher   # first: creates the CA (data/ca/ca.crt)
#   docker compose -f docker-compose.traefik.yml up -d
#   ufw allow 80,443/tcp   # 80 only for the HTTP→HTTPS redirect and the Let's Encrypt challenge
#   ufw delete allow from 10.99.0.0/24 to any port 9443 proto tcp   # 9443 is now only needed by Traefik (local)
#
# Settings come from environment variables (shell, .env next to this file or Portainer "Environment variables").
# Unset = the value after ":-" or "-".
services:
  aiopatcher:
    image: ghcr.io/b0ykoe/aiopatcher-server:${AIOPATCHER_VERSION:-latest} # for production, pin a version, e.g. 0.3.0
    container_name: aiopatcher
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${AIOPATCHER_DATA_PATH:-/opt/aiopatcher/data}:/data
    environment:
      AIOPatcher__PublicHostname: ${AIOPATCHER_HOSTNAME:?set AIOPATCHER_HOSTNAME (DNS name of the server)} # Agents: https://<hostname>:8443, dashboard: https://<hostname>
      AIOPatcher__DataDirectory: /data
      AIOPatcher__DashboardPort: "${AIOPATCHER_DASHBOARD_PORT:-9443}" # if changed, also adjust it in traefik/dynamic.yml
      AIOPatcher__AgentPort: "${AIOPATCHER_AGENT_PORT:-8443}"
      AIOPatcher__AgentProxyPort: "${AIOPATCHER_PROXY_PORT:-8080}" # agents from outside through a reverse proxy, LAN only
      AIOPatcher__TrustedProxies: "${AIOPATCHER_TRUSTED_PROXIES:-127.0.0.1}" # only Traefik may pass on the client IP (login throttling, audit log)
      AIOPatcher__Language: ${AIOPATCHER_LANGUAGE:-de}
      AIOPatcher__LockedFeatures: ${AIOPATCHER_LOCKED_FEATURES:-} # e.g. "AppUpdates,OpnsenseUpdates"; empty = nothing locked
      AIOPatcher__UpdateCheckRepository: ${AIOPATCHER_UPDATE_CHECK_REPOSITORY-b0ykoe/AIOPatcher} # empty = off
      TZ: ${TZ:-Europe/Berlin}

  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.4} # use the current v3 version
    container_name: traefik
    restart: unless-stopped
    network_mode: host
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # Dashboard publicly reachable (443 open): the TLS challenge is enough.
      - --certificatesresolvers.le.acme.tlschallenge=true
      # Dashboard internal/VPN only (recommended): use the DNS challenge instead, e.g. Hetzner DNS or Cloudflare.
      # - --certificatesresolvers.le.acme.dnschallenge.provider=hetzner
      # (plus under environment: HETZNER_API_KEY or CF_DNS_API_TOKEN)
      - --log.level=WARN
      - --accesslog=true
    volumes:
      - ${TRAEFIK_CONFIG_PATH:-/opt/aiopatcher/traefik}/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ${TRAEFIK_CONFIG_PATH:-/opt/aiopatcher/traefik}/letsencrypt:/letsencrypt
      # Only the CA certificate (not the key!), so that Traefik can verify the dashboard certificate.
      # create_host_path: false: if the file does not exist yet, startup fails instead of creating an empty folder.
      - type: bind
        source: ${AIOPATCHER_DATA_PATH:-/opt/aiopatcher/data}/ca/ca.crt
        target: /etc/traefik/aiopatcher-ca.crt
        read_only: true
        bind:
          create_host_path: false
