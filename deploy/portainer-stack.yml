# AIOPatcher als Portainer-Stack: Stacks → Add stack → Web editor (diese Datei einfügen) oder Upload.
# Unter "Environment variables" mindestens AIOPATCHER_HOSTNAME setzen (DNS-Name oder IP, unter der die Agents den
# Server erreichen). Nach "Deploy the stack": Container "aiopatcher" → Logs → Zeile mit "Setup token" suchen und
# https://<AIOPATCHER_HOSTNAME>:9443 öffnen.
#
# Daten liegen im Docker-Volume "aiopatcher-data" (Datenbank, CA, lokale CVE-Datenbank unter cache/).
# Update: Stack → "Pull and redeploy" (bei AIOPATCHER_VERSION=latest) oder die Version hochsetzen.
# Firewall: 8443 (Agents, mTLS) darf öffentlich sein, 9443 (Dashboard) nur intern/VPN.
#
# Alle weiteren Variablen (AIOPATCHER_…, TZ) sind optional; Standardwert jeweils hinter ":-" bzw. "-".
services:
  aiopatcher:
    image: ghcr.io/b0ykoe/aiopatcher-server:${AIOPATCHER_VERSION:-latest}
    pull_policy: always # bei jedem Deploy das aktuelle Image holen (Portainer nimmt sonst das alte, lokal gespeicherte :latest)
    container_name: aiopatcher
    restart: unless-stopped
    network_mode: host # Agents sehen die echte Server-IP, ufw-Regeln greifen
    volumes:
      - aiopatcher-data:/data
    environment:
      AIOPatcher__PublicHostname: ${AIOPATCHER_HOSTNAME:?AIOPATCHER_HOSTNAME setzen (DNS-Name oder IP des Servers)}
      AIOPatcher__DataDirectory: /data
      AIOPatcher__DashboardPort: "${AIOPATCHER_DASHBOARD_PORT:-9443}"
      AIOPatcher__AgentPort: "${AIOPATCHER_AGENT_PORT:-8443}"
      AIOPatcher__Language: ${AIOPATCHER_LANGUAGE:-de}
      AIOPatcher__TrustedProxies: ${AIOPATCHER_TRUSTED_PROXIES:-} # nur mit Reverse Proxy, z. B. "127.0.0.1"; leer = kein Proxy
      AIOPatcher__LockedFeatures: ${AIOPATCHER_LOCKED_FEATURES:-} # z. B. "AppUpdates,OpnsenseUpdates"; leer = nichts gesperrt
      AIOPatcher__UpdateCheckRepository: ${AIOPATCHER_UPDATE_CHECK_REPOSITORY-b0ykoe/AIOPatcher} # Hinweis auf neue Versionen; leer = aus
      TZ: ${TZ:-Europe/Berlin}
    labels:
      - autoheal=true

volumes:
  aiopatcher-data:
