# AIOPatcher: server + dashboard in one container. One file for Docker Compose and Portainer;
# all settings come from the .env next to it (template: .env.example) or from Portainer's "Environment variables".
#
# Docker Compose:
#   mkdir -p /opt/aiopatcher && cd /opt/aiopatcher
#   copy docker-compose.yml and .env.example here, .env.example → .env, fill in AIOPATCHER_HOSTNAME
#   docker compose up -d && docker compose logs aiopatcher | grep -i "setup token"
#
# Portainer: app template (README → "With Portainer") or Stacks → Add stack → Repository or Upload,
#   import the variables from the .env via "Load variables from .env file".
#
# In detail (VM, firewall, backups): docs/SERVER-SETUP.md. With Traefik: deploy/docker-compose.traefik.yml.
# nginx / Nginx Proxy Manager: docs/REVERSE-PROXY.md.
#
# Updates: the dashboard shows when a new version is available. Every "docker compose up -d" or every deploy in
# Portainer pulls the current image (AIOPATCHER_PULL_POLICY, default always).
#
# Unset variables = the value after ":-" or "-". Only AIOPATCHER_HOSTNAME is required.
services:
  aiopatcher:
    image: ghcr.io/b0ykoe/aiopatcher-server:${AIOPATCHER_VERSION:-latest} # for production, better pin a version, e.g. 0.6.1
    pull_policy: ${AIOPATCHER_PULL_POLICY:-always} # never for a self-built image (aiopatcher-server:local)
    container_name: aiopatcher
    restart: unless-stopped
    network_mode: host # so that ufw rules apply (Docker port mappings would bypass ufw)
    volumes:
      # Host folder (default) or name of a Docker volume (e.g. aiopatcher-data, which is what the Portainer template creates)
      - ${AIOPATCHER_DATA_PATH:-/opt/aiopatcher/data}:/data
    environment:
      AIOPatcher__PublicHostname: ${AIOPATCHER_HOSTNAME:?set AIOPATCHER_HOSTNAME (DNS name or IP under which the agents reach the server)}
      AIOPatcher__DataDirectory: /data
      AIOPatcher__DashboardPort: "${AIOPATCHER_DASHBOARD_PORT:-9443}" # expose internally/VPN only
      AIOPatcher__AgentPort: "${AIOPATCHER_AGENT_PORT:-8443}" # may be publicly reachable (mTLS)
      # HTTP for your own reverse proxy (hosts outside, Settings → Public access); expose on the LAN only, 0 = off
      AIOPatcher__AgentProxyPort: "${AIOPATCHER_PROXY_PORT:-8080}"
      AIOPatcher__Language: ${AIOPATCHER_LANGUAGE:-de}
      # only with a reverse proxy in front of the dashboard, e.g. "127.0.0.1", see docs/REVERSE-PROXY.md; empty = no proxy
      AIOPatcher__TrustedProxies: ${AIOPATCHER_TRUSTED_PROXIES:-}
      # can never be turned on, not even in the dashboard, e.g. "AppUpdates,OpnsenseUpdates"; empty = nothing locked
      AIOPatcher__LockedFeatures: ${AIOPATCHER_LOCKED_FEATURES:-}
      # notice about new versions; set to empty (AIOPATCHER_UPDATE_CHECK_REPOSITORY=) = off
      AIOPatcher__UpdateCheckRepository: ${AIOPATCHER_UPDATE_CHECK_REPOSITORY-b0ykoe/AIOPatcher}
      TZ: ${TZ:-Europe/Berlin}
    # The healthcheck is built into the image (/healthz). "docker ps" shows "healthy".
    labels:
      - autoheal=true # only relevant if the autoheal container below is enabled

  # --- Optional: watchdog --------------------------------------------------------------------------
  # Docker restarts crashed containers on its own (restart: unless-stopped), but not ones that are merely "unhealthy".
  # autoheal restarts containers labeled autoheal=true when their healthcheck keeps failing.
  # autoheal:
  #   image: willfarrell/autoheal:latest # pin a version for production
  #   container_name: autoheal
  #   restart: unless-stopped
  #   environment:
  #     AUTOHEAL_CONTAINER_LABEL: autoheal
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

  # --- Optional: get notified about new images (recommended: Diun) ---------------------------------
  # Diun only reports new images (ntfy, mail, Telegram …) and updates nothing. Fits "nothing happens unattended".
  # diun:
  #   image: crazymax/diun:latest # pin a version for production
  #   container_name: diun
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - /opt/aiopatcher/diun:/data
  #   environment:
  #     TZ: Europe/Berlin
  #     DIUN_WATCH_SCHEDULE: "0 7 * * *"
  #     DIUN_PROVIDERS_DOCKER: "true"
  #     DIUN_NOTIF_NTFY_ENDPOINT: "https://ntfy.sh"
  #     DIUN_NOTIF_NTFY_TOPIC: "YOUR-SECRET-TOPIC"

  # --- Optional: update automatically (only if you really want that) ------------------------------
  # Watchtower (maintained fork) pulls new images and restarts. A patch tool that updates itself at night
  # is convenient, but risky. WATCHTOWER_MONITOR_ONLY=true = report only.
  # watchtower:
  #   image: nickfedor/watchtower:latest
  #   container_name: watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     WATCHTOWER_MONITOR_ONLY: "true"
  #     WATCHTOWER_SCHEDULE: "0 0 7 * * *"
  #     WATCHTOWER_NOTIFICATION_URL: "ntfy://ntfy.sh/YOUR-SECRET-TOPIC"
  #     TZ: Europe/Berlin

# Only used if AIOPATCHER_DATA_PATH is a volume name instead of a folder.
volumes:
  aiopatcher-data:
