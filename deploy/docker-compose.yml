# AIOPatcher: Server + Dashboard in einem Container.
# Schnellstart: README.md → "Schnellstart". Ausführlich (VM, Firewall, Backups): docs/SERVER-SETUP.md.
#
#   mkdir -p /opt/aiopatcher/data   (Besitzer setzt der Container beim Start selbst)
#   docker compose up -d && docker compose logs aiopatcher | grep -i "setup token"
#
# Mit Traefik: deploy/docker-compose.traefik.yml. nginx / Nginx Proxy Manager: docs/REVERSE-PROXY.md.
#
# Updates von AIOPatcher selbst: Das Dashboard zeigt an, wenn eine neue Version da ist (UpdateCheckRepository).
# Aktualisieren dann mit:  docker compose pull && docker compose up -d
#
# Einstellungen kommen aus Umgebungsvariablen (Shell, .env neben dieser Datei oder Portainer "Environment variables").
# Nicht gesetzt = der Wert hinter ":-" bzw. "-".
services:
  aiopatcher:
    image: ghcr.io/b0ykoe/aiopatcher-server:${AIOPATCHER_VERSION:-latest} # für Produktion besser eine feste Version, z. B. 0.3.0
    container_name: aiopatcher
    restart: unless-stopped
    network_mode: host # damit ufw-Regeln greifen (Docker-Port-Mappings würden ufw umgehen)
    volumes:
      - ${AIOPATCHER_DATA_PATH:-/opt/aiopatcher/data}:/data
    environment:
      AIOPatcher__PublicHostname: ${AIOPATCHER_HOSTNAME:-patch.example.com} # DNS-Name, unter dem Agents den Server erreichen
      AIOPatcher__DataDirectory: /data
      AIOPatcher__DashboardPort: "${AIOPATCHER_DASHBOARD_PORT:-9443}" # nur intern/VPN freigeben
      AIOPatcher__AgentPort: "${AIOPATCHER_AGENT_PORT:-8443}" # darf öffentlich erreichbar sein (mTLS)
      AIOPatcher__Language: ${AIOPATCHER_LANGUAGE:-de}
      # nur mit Reverse Proxy vor dem Dashboard, z. B. "127.0.0.1", siehe docs/REVERSE-PROXY.md; leer = kein Proxy
      AIOPatcher__TrustedProxies: ${AIOPATCHER_TRUSTED_PROXIES:-}
      # nie einschaltbar, auch nicht im Dashboard, z. B. "AppUpdates,OpnsenseUpdates"; leer = nichts gesperrt
      AIOPatcher__LockedFeatures: ${AIOPATCHER_LOCKED_FEATURES:-}
      # Hinweis auf neue Versionen; auf leer setzen (AIOPATCHER_UPDATE_CHECK_REPOSITORY=) = aus
      AIOPatcher__UpdateCheckRepository: ${AIOPATCHER_UPDATE_CHECK_REPOSITORY-b0ykoe/AIOPatcher}
      TZ: ${TZ:-Europe/Berlin}
    # Healthcheck ist im Image eingebaut (/healthz). "docker ps" zeigt "healthy".
    labels:
      - autoheal=true # nur relevant, wenn der autoheal-Container unten aktiv ist

  # --- Optional: Watchdog --------------------------------------------------------------------------
  # Docker startet abgestürzte Container selbst neu (restart: unless-stopped), aber keine, die nur "unhealthy" sind.
  # autoheal startet Container mit Label autoheal=true neu, wenn der Healthcheck dauerhaft fehlschlägt.
  # autoheal:
  #   image: willfarrell/autoheal:latest # für Produktion feste Version eintragen
  #   container_name: autoheal
  #   restart: unless-stopped
  #   environment:
  #     AUTOHEAL_CONTAINER_LABEL: autoheal
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

  # --- Optional: über neue Images benachrichtigen (empfohlen: Diun) ---------------------------------
  # Diun meldet neue Images nur (ntfy, Mail, Telegram …) und aktualisiert nichts. Passt zu "nichts passiert unbeaufsichtigt".
  # diun:
  #   image: crazymax/diun:latest # für Produktion feste Version eintragen
  #   container_name: diun
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - /opt/aiopatcher/diun:/data
  #   environment:
  #     TZ: Europe/Berlin
  #     DIUN_WATCH_SCHEDULE: "0 7 * * *"
  #     DIUN_PROVIDERS_DOCKER: "true"
  #     DIUN_NOTIF_NTFY_ENDPOINT: "https://ntfy.sh"
  #     DIUN_NOTIF_NTFY_TOPIC: "DEIN-GEHEIMES-TOPIC"

  # --- Optional: automatisch aktualisieren (nur wenn du das wirklich willst) ------------------------
  # Watchtower (gepflegter Fork) zieht neue Images und startet neu. Ein Patch-Tool, das sich nachts selbst
  # aktualisiert, ist bequem, aber riskant. WATCHTOWER_MONITOR_ONLY=true = nur melden.
  # watchtower:
  #   image: nickfedor/watchtower:latest
  #   container_name: watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     WATCHTOWER_MONITOR_ONLY: "true"
  #     WATCHTOWER_SCHEDULE: "0 0 7 * * *"
  #     WATCHTOWER_NOTIFICATION_URL: "ntfy://ntfy.sh/DEIN-GEHEIMES-TOPIC"
  #     TZ: Europe/Berlin
