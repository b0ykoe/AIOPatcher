# Traefik routing for the AIOPatcher dashboard (file provider). Belongs to deploy/docker-compose.traefik.yml.
# Adjust: hostname (Host rule) and the allowed networks.
http:
  routers:
    aiopatcher:
      rule: Host(`patch.example.com`)
      entryPoints: [websecure]
      service: aiopatcher
      middlewares: [aiopatcher-intern]
      tls:
        certResolver: le

  middlewares:
    # The dashboard does not belong on the open internet: only let LAN and VPN through.
    aiopatcher-intern:
      ipAllowList:
        sourceRange:
          - 10.99.0.0/24 # VPN
          - 192.168.0.0/16 # LAN
          - 127.0.0.1/32

  services:
    aiopatcher:
      loadBalancer:
        serversTransport: aiopatcher
        servers:
          - url: https://127.0.0.1:9443

  serversTransports:
    # AIOPatcher speaks HTTPS itself, with a certificate from its own CA. "localhost" is always in the certificate.
    aiopatcher:
      serverName: localhost
      rootCAs:
        - /etc/traefik/aiopatcher-ca.crt

# Optional, only if agents CANNOT reach 8443 directly (e.g. AIOPatcher on an internal VM):
# TCP passthrough, Traefik passes the encrypted connection through unchanged (mTLS stays end-to-end).
# For this, in the compose file: --entrypoints.agents.address=:8443 and run AIOPatcher on the internal VM.
# Downside: AIOPatcher then sees Traefik's IP instead of the agents' (site network restrictions do not work).
# tcp:
#   routers:
#     aiopatcher-agents:
#       rule: HostSNI(`*`)
#       entryPoints: [agents]
#       service: aiopatcher-agents
#       tls:
#         passthrough: true
#   services:
#     aiopatcher-agents:
#       loadBalancer:
